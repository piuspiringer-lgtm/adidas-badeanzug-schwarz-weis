<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Badeanzug Sommer 2026</title>

  <!-- WhatsApp / Open Graph preview -->
  <meta property="og:title" content="Badeanzug Sommer 2026">
  <meta property="og:description" content="Schau dir dieses Modell an">
  <!-- Ersetze diese URL später durch die URL zu deinem eigenen Coverbild -->
  <meta property="og:image" content="https://placehold.co/1200x630/png?text=Badeanzug+Sommer+2026">
  <meta property="og:type" content="website">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(430px, 100%);
      background: white;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,.12);
    }
    .cover {
      aspect-ratio: 4 / 3;
      width: 100%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 25% 30%, #fff 0 8%, transparent 9%),
        linear-gradient(135deg, #dbeafe, #fce7f3);
      font-size: 82px;
      cursor: pointer;
      user-select: none;
    }
    .content { padding: 22px; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { margin: 0 0 18px; color: #555; }
    a.button {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #111;
      color: #fff;
      padding: 14px 18px;
      border-radius: 14px;
      font-weight: 700;
    }
    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>
  <main class="card">
    <a href="https://youtu.be/dQw4w9WgXcQ?is=_RmEPhQ2Su5GClMk" target="_blank" rel="noopener noreferrer" style="text-decoration:none">
      <div class="cover" aria-label="Badeanzug ansehen">🩱</div>
    </a>

    <div class="content">
      <h1>Badeanzug Sommer 2026</h1>
      <p>Schau dir dieses Modell an.</p>

      <a class="button"
         href="https://youtu.be/dQw4w9WgXcQ?is=_RmEPhQ2Su5GClMk"
         target="_blank"
         rel="noopener noreferrer">
        Ansehen
      </a>

      <div class="hint">
        Tipp: Für eine echte WhatsApp-Vorschau musst du diese Datei online hosten
        und bei og:image eine öffentlich erreichbare Bild-URL eintragen.
      </div>
    </div>
  </main>
</body>
</html>
