[package]
name = "jarvis-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
jarvis-cli.workspace = true
jarvis-agent.workspace = true
jarvis-runtime.workspace = true
jarvis-permissions.workspace = true
jarvis-resources.workspace = true
jarvis-memory.workspace = true
jarvis-voice.workspace = true
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# Von `tauri build` automatisch gesetzt; für E2E-Tests mit eingebauter Oberfläche:
# cargo build -p jarvis-desktop --features custom-protocol
custom-protocol = ["tauri/custom-protocol"]
